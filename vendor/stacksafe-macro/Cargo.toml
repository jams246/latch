# Locally reconstructed with proc-macro-error3 diagnostics; see PATCH.md.
[package]
name = "stacksafe-macro"
version = "0.1.4"
edition = "2021"
rust-version = "1.80.0"
description = "Procedural macro implementation for the stacksafe crate."
license = "Apache-2.0"
repository = "https://github.com/fast/stacksafe"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro-error3 = { version = "3.1.1", default-features = false, features = ["syn2-error"] }
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
stacksafe = "=0.1.4"
