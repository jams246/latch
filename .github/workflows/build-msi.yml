name: Build Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check version
        id: version
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
              ./scripts/check-version.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
              ./scripts/check-version.ps1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test version scripts
        run: ./scripts/tests/versioning.ps1

      - name: Verify and build MSI
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ build tools not found.' }
          $setup = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $nativeEnvironment = & $env:ComSpec /d /c ('"{0}" -no_logo -arch=x64 -host_arch=x64 && set' -f $setup)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize the Visual Studio build environment.' }
          foreach ($entry in $nativeEnvironment) {
              $separator = $entry.IndexOf('=')
              if ($separator -gt 0) {
                  [Environment]::SetEnvironmentVariable($entry.Substring(0, $separator), $entry.Substring($separator + 1), 'Process')
              }
          }
          . ./scripts/native-perl.ps1
          $env:OPENSSL_SRC_PERL = Get-NativePerl
          $env:PERL = $env:OPENSSL_SRC_PERL
          $env:PATH = (Split-Path -Parent $env:PERL) + ';' + $env:PATH
          $env:GPUI_FXC_PATH = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\fxc.exe') |
              Select-Object -First 1 -ExpandProperty FullName
          if (!$env:GPUI_FXC_PATH) { throw 'Windows SDK shader compiler fxc.exe not found.' }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --release --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-msi.ps1

      - name: Upload MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latch-${{ steps.version.outputs.version }}-windows-x64-msi
          path: target/wix/*.msi
          if-no-files-found: error
